<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ebb"/>
      <stop offset="100%" stop-color="#f27289"/>
    </linearGradient>
  </defs>
  <!-- 5 Petals of Cherry Blossom -->
  <g transform="translate(50,50)">
    <!-- Petal 1 -->
    <path d="M0 0 C-15 -25 -20 -45 0 -48 C20 -45 15 -25 0 0 Z" fill="url(#sakuraGrad)"/>
    <!-- Petal 2 -->
    <path d="M0 0 C-15 -25 -20 -45 0 -48 C20 -45 15 -25 0 0 Z" fill="url(#sakuraGrad)" transform="rotate(72)"/>
    <!-- Petal 3 -->
    <path d="M0 0 C-15 -25 -20 -45 0 -48 C20 -45 15 -25 0 0 Z" fill="url(#sakuraGrad)" transform="rotate(144)"/>
    <!-- Petal 4 -->
    <path d="M0 0 C-15 -25 -20 -45 0 -48 C20 -45 15 -25 0 0 Z" fill="url(#sakuraGrad)" transform="rotate(216)"/>
    <!-- Petal 5 -->
    <path d="M0 0 C-15 -25 -20 -45 0 -48 C20 -45 15 -25 0 0 Z" fill="url(#sakuraGrad)" transform="rotate(288)"/>
    
    <!-- Pistils -->
    <circle cx="0" cy="0" r="8" fill="#ffd166"/>
    <circle cx="-3" cy="-3" r="2" fill="#fff"/>
    <circle cx="3" cy="2" r="2" fill="#fff"/>
  </g>
</svg>
