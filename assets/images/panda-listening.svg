<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <defs>
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#ff7eb3"/>
    </linearGradient>
    <filter id="softShadowH" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea7a8f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Musical notes floating -->
  <path d="M320 80 Q330 60 345 70 L345 100 Q335 95 325 105 Z" fill="#ff758c" opacity="0.7"/>
  <circle cx="325" cy="105" r="7" fill="#ff758c" opacity="0.7"/>
  <path d="M70 110 Q80 90 95 100 L95 125 Q85 120 75 130 Z" fill="#ff758c" opacity="0.6"/>
  <circle cx="75" cy="130" r="6" fill="#ff758c" opacity="0.6"/>

  <!-- Ears -->
  <circle cx="125" cy="130" r="36" fill="#2d3142"/>
  <circle cx="125" cy="130" r="20" fill="#474d61"/>
  <circle cx="275" cy="130" r="36" fill="#2d3142"/>
  <circle cx="275" cy="130" r="20" fill="#474d61"/>

  <!-- Headphone Band -->
  <path d="M100 185 C100 80 300 80 300 185" fill="none" stroke="url(#headphoneGrad)" stroke-width="16" stroke-linecap="round" filter="url(#softShadowH)"/>

  <!-- Head -->
  <ellipse cx="200" cy="190" rx="100" ry="85" fill="#ffffff" filter="url(#softShadowH)"/>

  <!-- Eye Patches -->
  <ellipse cx="155" cy="185" rx="26" ry="20" fill="#2d3142" transform="rotate(-15 155 185)"/>
  <ellipse cx="245" cy="185" rx="26" ry="20" fill="#2d3142" transform="rotate(15 245 185)"/>

  <!-- Happy closed eyes / listening blissfully -->
  <path d="M143 185 Q155 195 167 185" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M233 185 Q245 195 257 185" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="130" cy="210" rx="15" ry="9" fill="#ff9ebb" opacity="0.6"/>
  <ellipse cx="270" cy="210" rx="15" ry="9" fill="#ff9ebb" opacity="0.6"/>

  <!-- Nose & Cute Smiling Mouth -->
  <ellipse cx="200" cy="205" rx="9" ry="6" fill="#2d3142"/>
  <path d="M190 216 Q200 226 210 216" fill="none" stroke="#2d3142" stroke-width="3" stroke-linecap="round"/>

  <!-- Headphone Ear Pads -->
  <rect x="85" y="160" width="28" height="55" rx="14" fill="#ff758c" filter="url(#softShadowH)"/>
  <rect x="91" y="168" width="16" height="39" rx="8" fill="#ff9ebb"/>
  <rect x="287" y="160" width="28" height="55" rx="14" fill="#ff758c" filter="url(#softShadowH)"/>
  <rect x="293" y="168" width="16" height="39" rx="8" fill="#ff9ebb"/>

  <!-- Body / Shoulders -->
  <ellipse cx="200" cy="310" rx="95" ry="65" fill="#2d3142"/>
  <ellipse cx="200" cy="305" rx="60" ry="45" fill="#ffffff"/>
</svg>
