<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pandaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeef0"/>
      <stop offset="100%" stop-color="#ffdbe1"/>
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8f3"/>
      <stop offset="100%" stop-color="#f5e1d5"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ea7a8f" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Glow Circle -->
  <circle cx="250" cy="250" r="210" fill="url(#pandaBg)"/>

  <!-- Pagoda Silhouette in Background -->
  <g opacity="0.25" fill="#e07a8b">
    <path d="M120 320 L160 270 L145 270 L170 230 L155 230 L180 190 L185 190 L180 230 L195 230 L170 270 L185 270 Z"/>
    <rect x="150" y="320" width="60" height="70"/>
    <path d="M130 320 Q180 300 230 320 L210 270 Q180 260 150 270 Z"/>
  </g>

  <!-- Bamboo Leaves Background -->
  <g opacity="0.6">
    <path d="M380 360 Q420 300 400 240 Q410 300 440 330 Z" fill="#88b04b"/>
    <path d="M400 380 Q450 330 460 270 Q440 330 430 370 Z" fill="#6f9e33"/>
  </g>

  <!-- Sakura Blossoms Falling -->
  <g fill="#ff9ebb" opacity="0.85">
    <circle cx="90" cy="120" r="14"/>
    <circle cx="102" cy="110" r="12"/>
    <circle cx="80" cy="108" r="12"/>
    <circle cx="75" cy="125" r="12"/>
    <circle cx="95" cy="135" r="12"/>
    <circle cx="89" cy="120" r="5" fill="#fcd34d"/>
    
    <path d="M60 200 Q75 190 70 215 Q55 210 60 200 Z" fill="#ffb3c6"/>
    <path d="M390 140 Q410 130 405 155 Q385 150 390 140 Z" fill="#ffb3c6"/>
    <path d="M430 200 Q445 195 440 215 Q425 210 430 200 Z" fill="#ffb3c6"/>
  </g>

  <!-- Panda Ears -->
  <circle cx="160" cy="160" r="42" fill="#2d3142" filter="url(#softShadow)"/>
  <circle cx="160" cy="160" r="24" fill="#474d61"/>
  <circle cx="340" cy="160" r="42" fill="#2d3142" filter="url(#softShadow)"/>
  <circle cx="340" cy="160" r="24" fill="#474d61"/>

  <!-- Panda Body -->
  <ellipse cx="250" cy="360" rx="125" ry="100" fill="#2d3142" filter="url(#softShadow)"/>
  
  <!-- Panda Head -->
  <ellipse cx="250" cy="230" rx="115" ry="98" fill="#ffffff" filter="url(#softShadow)"/>

  <!-- Eye Patches -->
  <ellipse cx="195" cy="225" rx="30" ry="24" fill="#2d3142" transform="rotate(-15 195 225)"/>
  <ellipse cx="305" cy="225" rx="30" ry="24" fill="#2d3142" transform="rotate(15 305 225)"/>

  <!-- Eyes & Sparkles -->
  <circle cx="200" cy="223" r="12" fill="#ffffff"/>
  <circle cx="202" cy="222" r="7" fill="#1e2029"/>
  <circle cx="204" cy="220" r="3" fill="#ffffff"/>

  <circle cx="300" cy="223" r="12" fill="#ffffff"/>
  <circle cx="298" cy="222" r="7" fill="#1e2029"/>
  <circle cx="296" cy="220" r="3" fill="#ffffff"/>

  <!-- Blush Cheeks -->
  <ellipse cx="165" cy="255" rx="18" ry="11" fill="#ff9ebb" opacity="0.6"/>
  <ellipse cx="335" cy="255" rx="18" ry="11" fill="#ff9ebb" opacity="0.6"/>

  <!-- Cute Nose & Mouth -->
  <path d="M242 245 C242 240 258 240 258 245 C258 252 250 256 250 256 C250 256 242 252 242 245 Z" fill="#2d3142"/>
  <path d="M250 256 L250 262" stroke="#2d3142" stroke-width="3" stroke-linecap="round"/>
  <path d="M236 264 Q250 274 250 262 Q250 274 264 264" fill="none" stroke="#2d3142" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Open smiling tongue -->
  <path d="M242 267 Q250 280 258 267 Z" fill="#ff6b8b"/>

  <!-- Traditional Hanfu / Cheongsam Shirt -->
  <path d="M165 315 Q250 330 335 315 L350 420 Q250 445 150 420 Z" fill="url(#clothGrad)" filter="url(#softShadow)"/>
  
  <!-- Collar & Red Frog Button Knots -->
  <path d="M210 320 Q250 338 290 320" fill="none" stroke="#e87a90" stroke-width="5" stroke-linecap="round"/>
  <line x1="250" y1="327" x2="250" y2="420" stroke="#e87a90" stroke-width="4"/>
  
  <!-- Buttons -->
  <circle cx="250" cy="345" r="5" fill="#e87a90"/>
  <circle cx="240" cy="345" r="3" fill="#e87a90"/>
  <circle cx="260" cy="345" r="3" fill="#e87a90"/>

  <circle cx="250" cy="375" r="5" fill="#e87a90"/>
  <circle cx="240" cy="375" r="3" fill="#e87a90"/>
  <circle cx="260" cy="375" r="3" fill="#e87a90"/>

  <circle cx="250" cy="405" r="5" fill="#e87a90"/>
  <circle cx="240" cy="405" r="3" fill="#e87a90"/>
  <circle cx="260" cy="405" r="3" fill="#e87a90"/>

  <!-- Bamboo Pattern on Shirt -->
  <g opacity="0.3" stroke="#88b04b" stroke-width="2">
    <path d="M190 360 Q195 380 185 400"/>
    <path d="M193 375 Q205 370 215 373"/>
    <path d="M190 388 Q180 385 170 390"/>
  </g>

  <!-- Paws Waving -->
  <ellipse cx="140" cy="390" rx="26" ry="22" fill="#2d3142"/>
  
  <!-- Right Paw Waving (Greeting / Ni Hao) -->
  <g transform="rotate(-20 370 300)">
    <ellipse cx="370" cy="300" rx="28" ry="34" fill="#2d3142" filter="url(#softShadow)"/>
    <!-- Paw pads (Pink) -->
    <ellipse cx="370" cy="305" rx="14" ry="11" fill="#ff9ebb"/>
    <circle cx="358" cy="288" r="4" fill="#ff9ebb"/>
    <circle cx="369" cy="284" r="4.5" fill="#ff9ebb"/>
    <circle cx="381" cy="288" r="4" fill="#ff9ebb"/>
  </g>

  <!-- Chinese Books on Bottom Left -->
  <g transform="translate(40, 360)">
    <rect x="0" y="0" width="85" height="18" rx="3" fill="#d9777f"/>
    <text x="42" y="13" font-size="10" font-family="sans-serif" font-weight="bold" fill="#fff" text-anchor="middle">中文</text>
    <rect x="-4" y="18" width="92" height="18" rx="3" fill="#588b76"/>
    <text x="42" y="31" font-size="10" font-family="sans-serif" font-weight="bold" fill="#fff" text-anchor="middle">汉语</text>
    <rect x="-8" y="36" width="100" height="20" rx="3" fill="#d4a373"/>
    <text x="42" y="50" font-size="10" font-family="sans-serif" font-weight="bold" fill="#fff" text-anchor="middle">学习</text>
  </g>

  <!-- Pen Pot with Bamboo Pen on Right -->
  <g transform="translate(370, 370)">
    <rect x="10" y="20" width="36" height="42" rx="6" fill="#fcdfe5" stroke="#f497aa" stroke-width="2"/>
    <circle cx="28" cy="41" r="5" fill="#ff809b"/>
    <line x1="22" y1="20" x2="16" y2="-10" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/>
    <polygon points="16,-10 14,-18 18,-14" fill="#f6bd60"/>
    <line x1="32" y1="20" x2="38" y2="-8" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>
    <polygon points="38,-8 41,-16 43,-10" fill="#f6bd60"/>
  </g>
</svg>
