<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <defs>
    <filter id="softShadowR" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ea7a8f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ears -->
  <circle cx="125" cy="130" r="36" fill="#2d3142"/>
  <circle cx="125" cy="130" r="20" fill="#474d61"/>
  <circle cx="275" cy="130" r="36" fill="#2d3142"/>
  <circle cx="275" cy="130" r="20" fill="#474d61"/>

  <!-- Head -->
  <ellipse cx="200" cy="190" rx="100" ry="85" fill="#ffffff" filter="url(#softShadowR)"/>

  <!-- Eye Patches -->
  <ellipse cx="155" cy="185" rx="26" ry="20" fill="#2d3142" transform="rotate(-15 155 185)"/>
  <ellipse cx="245" cy="185" rx="26" ry="20" fill="#2d3142" transform="rotate(15 245 185)"/>

  <!-- Focused studying eyes looking slightly down -->
  <circle cx="156" cy="188" r="8" fill="#ffffff"/>
  <circle cx="156" cy="190" r="5" fill="#1e2029"/>
  <circle cx="244" cy="188" r="8" fill="#ffffff"/>
  <circle cx="244" cy="190" r="5" fill="#1e2029"/>

  <!-- Blush -->
  <ellipse cx="130" cy="210" rx="15" ry="9" fill="#ff9ebb" opacity="0.6"/>
  <ellipse cx="270" cy="210" rx="15" ry="9" fill="#ff9ebb" opacity="0.6"/>

  <!-- Cute Nose & Mouth -->
  <ellipse cx="200" cy="205" rx="8" ry="5" fill="#2d3142"/>
  <path d="M193 216 Q200 223 207 216" fill="none" stroke="#2d3142" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="200" cy="310" rx="95" ry="65" fill="#2d3142"/>

  <!-- Open Book in Front -->
  <g transform="translate(115, 230)" filter="url(#softShadowR)">
    <!-- Book Cover Background -->
    <path d="M5 50 Q85 30 85 85 Q5 95 5 50 Z" fill="#3a86ff"/>
    <path d="M165 50 Q85 30 85 85 Q165 95 165 50 Z" fill="#2b6cb0"/>
    
    <!-- Book Pages -->
    <path d="M10 46 Q85 28 85 80 Q10 88 10 46 Z" fill="#ffffff"/>
    <path d="M160 46 Q85 28 85 80 Q160 88 160 46 Z" fill="#f8f9fa"/>
    
    <!-- Chinese Characters on Page -->
    <text x="45" y="65" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="bold" fill="#3a86ff" text-anchor="middle">学</text>
    <text x="125" y="65" font-family="'Noto Sans SC', sans-serif" font-size="16" font-weight="bold" fill="#3a86ff" text-anchor="middle">习</text>

    <!-- Page lines -->
    <line x1="20" y1="74" x2="70" y2="74" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="100" y1="74" x2="150" y2="74" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Paws holding book -->
    <circle cx="10" cy="65" r="12" fill="#2d3142"/>
    <circle cx="160" cy="65" r="12" fill="#2d3142"/>
  </g>
</svg>
